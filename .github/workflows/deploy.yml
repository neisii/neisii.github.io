# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # package-manager는 적지 않는다. 적으면 withastro/action이 버전 없는 값에 "latest"를 채워
          # package.json의 packageManager(pnpm 12.16.1)와 두 곳 지정으로 거부된다. 비워 두면 잠금 파일로
          # pnpm을 고르고, pnpm/action-setup이 packageManager의 버전을 쓴다(withastro/action v3 action.yml).
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4